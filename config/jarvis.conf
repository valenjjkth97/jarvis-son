# Jarvis-son V1 · configuración (clave = valor). "~" se expande al HOME de Termux.
whisper_cli = ~/whisper.cpp/build/bin/whisper-cli
whisper_modelo = ~/whisper.cpp/models/ggml-base.bin
llama_cli = ~/llama.cpp/build/bin/llama-cli
llama_modelo = ~/models/Qwen3.5-0.8B-Q4_0.gguf
contexto = 1024
max_tokens = 96
hilos = 4
segundos_grabacion = 6
instruccion_sistema = Eres Jarvis, un asistente de voz. Responde en español, en una o dos frases cortas y correctas.
# Ajustes de decodificación (se confirman con la evaluación de la Etapa 4)
razonamiento = off
penalizacion_repeticion = 1.2

# TTS: "sherpa" (voz Piper local con sherpa-onnx) o "termux" (respaldo de demostración)
tts_modo = termux
sherpa_bin = ~/sherpa-onnx/build/bin/sherpa-onnx-offline-tts
sherpa_modelo = ~/models/vits-piper-es_MX-ald-medium/es_MX-ald-medium.onnx
sherpa_tokens = ~/models/vits-piper-es_MX-ald-medium/tokens.txt
sherpa_datos = ~/models/vits-piper-es_MX-ald-medium/espeak-ng-data
sherpa_hz = 22050

dir_temporal = tmp
dir_logs = logs
registro_csv = logs/turnos.csv
